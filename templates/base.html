<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Система бронирования{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Система бронирования</h1>
            <nav>
                <a href="{{ url_for('index') }}" class="nav-link">Главная</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>Курсовой проект: Система бронирования с временной блокировкой мест</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
